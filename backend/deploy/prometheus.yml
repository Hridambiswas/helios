global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: helios

scrape_configs:
  # Emits helios_agent_latency, helios_critic_score, helios_critic_pass_total,
  # helios_verifier_score, helios_verifier_pass_total, helios_pipeline_latency,
  # and helios_pipeline_requests_total (with 'verifier_failed' status label).
  - job_name: "helios-api"
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics
    scrape_timeout: 10s

  - job_name: "helios-worker"
    static_configs:
      - targets: ["worker:9100"]
    scrape_timeout: 10s

  - job_name: "redis"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
