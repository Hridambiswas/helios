name: Deploy Backend to VM

on:
  push:
    branches: [fix/request-failed, main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: SSH deploy to VM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 30m
          # Envs are needed so the shell can hard-reset to the exact ref
          # that triggered this workflow, not the drifted origin/main.
          envs: GITHUB_REF_NAME,GH_OAUTH_CLIENT_ID,GH_OAUTH_CLIENT_SECRET,SUPABASE_DATABASE_URL
          script: |
            set -e
            # Sync the VM checkout to the exact ref that triggered this
            # workflow — hard reset avoids conflicts with locally
            # modified files, and matches what the deploy runner tested.
            REF="${GITHUB_REF_NAME:-main}"
            cd ~/helios
            git fetch origin "$REF"
            git reset --hard "origin/$REF"

            # Inject secrets into backend/.env (idempotent — only adds if missing)
            if ! grep -q "SUPABASE_DATABASE_URL" ~/helios/backend/.env 2>/dev/null; then
              echo "SUPABASE_DATABASE_URL=${{ secrets.SUPABASE_DATABASE_URL }}" >> ~/helios/backend/.env
            fi
            if ! grep -q "GITHUB_CLIENT_ID" ~/helios/backend/.env 2>/dev/null; then
              echo "GITHUB_CLIENT_ID=${{ secrets.GH_OAUTH_CLIENT_ID }}" >> ~/helios/backend/.env
            fi
            if ! grep -q "GITHUB_CLIENT_SECRET" ~/helios/backend/.env 2>/dev/null; then
              echo "GITHUB_CLIENT_SECRET=${{ secrets.GH_OAUTH_CLIENT_SECRET }}" >> ~/helios/backend/.env
            fi

            # Always overwrite CORS_ALLOWED_ORIGINS — both Vercel URLs must be present
            sed -i '/^CORS_ALLOWED_ORIGINS=/d' ~/helios/backend/.env 2>/dev/null || true
            echo 'CORS_ALLOWED_ORIGINS=["https://helios-hridam.vercel.app","https://frontend-omega-blush-87.vercel.app"]' >> ~/helios/backend/.env

            # Always overwrite OAUTH_FRONTEND_URL to the canonical alias
            sed -i '/^OAUTH_FRONTEND_URL=/d' ~/helios/backend/.env 2>/dev/null || true
            echo 'OAUTH_FRONTEND_URL=https://helios-hridam.vercel.app' >> ~/helios/backend/.env

            # Free disk space before build — stale layers accumulate and
            # fill the volume (see 001_report.md: the 2026-09-24 deploy
            # died with 'no space left on device' during layer export).
            docker system prune -a -f
            docker builder prune -af || true
            cd ~/helios/backend
            docker compose -p helios -f docker-compose.yml -f docker-compose.prod.yml build api worker beat
            docker compose -p helios -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate api worker beat
            docker image prune -f

            # Post-deploy smoke test: nginx should answer /nginx-health quickly.
            for i in 1 2 3 4 5; do
              if curl -fsS -m 5 http://127.0.0.1/nginx-health >/dev/null; then
                echo "smoke test: nginx OK"
                break
              fi
              echo "smoke test: waiting for nginx ($i/5)"
              sleep 6
            done
            curl -fsS -m 5 http://127.0.0.1/nginx-health >/dev/null

            echo "Deploy complete at $(date)"
